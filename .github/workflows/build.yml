# Builds OpenComposite for Windows and Linux, 64- and 32-bit, the Windows installer, and packs the archives (scripts/ci;
# the same scripts build locally). A v* tag (v2026.11.07, say) also puts them on its release: a pushed tag gets a new draft release, to check
# and publish by hand; a tag made by publishing a release on GitHub's release page gets the files added to that release.
name: Build

on:
  push:
    branches: [openxr]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The vcpkg release the Windows builds take the Vulkan headers and loader from.
  VCPKG_REF: '2026.10.16'

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            dll: vrclient_x64.dll
            tests: true
          - arch: x86
            dll: vrclient.dll
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Vulkan headers and loader (vcpkg ${{ env.VCPKG_REF }})
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --quiet --depth 1 --branch $env:VCPKG_REF https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkg 'vcpkg.exe') install --vcpkg-root $vcpkg --triplet ${{ matrix.arch }}-windows vulkan-headers vulkan-loader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: >-
          scripts/ci/build-windows.ps1 -Arch ${{ matrix.arch }}
          -Vulkan (Join-Path $env:RUNNER_TEMP 'vcpkg\installed\${{ matrix.arch }}-windows')
          -Out build -Version "$env:GITHUB_SHA ($env:GITHUB_REF_NAME)"
          ${{ matrix.tests && '-Tests' || '' }}

      # Every OpenVR interface version Valve has shipped is offered or set aside with a reason (offline: it compares
      # interfaces.txt with the source)
      - name: Interface inventory
        if: matrix.tests
        run: python scripts/openvr_inventory.py --check

      # Nothing may end, crash or hang; every run is checked, and the summaries kept
      - name: Conformance
        if: matrix.tests
        shell: pwsh
        run: |
          $failed = 0
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime none --ci --out conformance/none
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --out conformance/stand-in --expected tests/conformance/expected/steamvr-1792185270.json --differences tests/conformance/differences.json
          if ($LASTEXITCODE) { $failed++ }
          # What OpenComposite does when OpenXR calls fail (expect/xr_failures.json)
          python tests/conformance/xr_failures.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --ci --out conformance/xr-failures
          if ($LASTEXITCODE) { $failed++ }
          # Exact answers for chosen cases (expect/)
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases submit-edges --expect tests/conformance/expect/submit.json --out conformance/submit-edges
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-calls --expect tests/conformance/expect/old_calls.json --out conformance/old-calls
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-submit --expect tests/conformance/expect/old_submit.json --out conformance/old-submit
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-overlay --expect tests/conformance/expect/old_overlay.json --out conformance/old-overlay
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-misc --expect tests/conformance/expect/old_misc.json --out conformance/old-misc
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases new-interfaces --expect tests/conformance/expect/new_interfaces.json --out conformance/new-interfaces
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases device-identity --expect tests/conformance/expect/device_identity.json --out conformance/device-identity
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases applications --expect tests/conformance/expect/applications.json --out conformance/applications
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases chaperone,chaperone-read --jobs 1 --script tests/conformance/scripts/stage_2x3.json --expect tests/conformance/expect/chaperone.json --out conformance/chaperone
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases events --script tests/conformance/scripts/legacy_click.json --expect tests/conformance/expect/events.json --out conformance/events
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases events-listen,events-commit --jobs 2 --expect tests/conformance/expect/events_two_processes.json --out conformance/events-two-processes
          if ($LASTEXITCODE) { $failed++ }
          # The old input as SteamVR's legacy binding files map it, under inputEvaluator=steamvr
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases events --script tests/conformance/scripts/legacy_click.json --ini tests/conformance/ini/steamvr_evaluator.ini --expect tests/conformance/expect/events_steamvr.json --out conformance/events-steamvr
          if ($LASTEXITCODE) { $failed++ }
          # The binding evaluator: inputEvaluator=steamvr evaluates a toggle_button; direct stays as it was; both read vector3
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-frames --script tests/conformance/scripts/input_toggle.json --manifest tests/unit/data/manifest_toggle.json --ini tests/conformance/ini/steamvr_evaluator.ini --expect tests/conformance/expect/input_evaluator.json --out conformance/input-steamvr
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-frames --script tests/conformance/scripts/input_toggle.json --manifest tests/unit/data/manifest_toggle.json --expected tests/conformance/baseline/input-direct.json --expect tests/conformance/expect/input_direct.json --out conformance/input-direct
          if ($LASTEXITCODE) { $failed++ }
          # Input from two threads at once, under both evaluators
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-threads --script tests/conformance/scripts/input_toggle.json --manifest tests/unit/data/manifest_toggle.json --ini tests/conformance/ini/steamvr_evaluator.ini --expect tests/conformance/expect/input_threads.json --out conformance/input-threads-steamvr
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-threads --script tests/conformance/scripts/input_toggle.json --manifest tests/unit/data/manifest_toggle.json --expect tests/conformance/expect/input_threads.json --out conformance/input-threads-direct
          if ($LASTEXITCODE) { $failed++ }
          # inputEvaluator=steamvr suggests bindings for the same profiles as direct
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-manifest --manifest tests/unit/data/manifest_a_only.json --out conformance/profiles-direct
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-manifest --manifest tests/unit/data/manifest_a_only.json --ini tests/conformance/ini/steamvr_evaluator.ini --out conformance/profiles-steamvr
          python tests/conformance/check_suggested_profiles.py conformance/profiles-direct/raw/case-input-manifest.dump.json conformance/profiles-steamvr/raw/case-input-manifest.dump.json
          if ($LASTEXITCODE) { $failed++ }
          # Converting bindings to other controllers only adds: everything bound without it is bound with it
          $env:OC_NO_BINDING_CONVERSION = '1'
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-manifest --out conformance/bindings-unconverted
          Remove-Item Env:OC_NO_BINDING_CONVERSION
          python tests/conformance/run.py --runtime build/bin/vrclient_x64.dll --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-manifest --out conformance/bindings-converted
          python tests/conformance/check_bindings_superset.py conformance/bindings-unconverted/raw/case-input-manifest.dump.json conformance/bindings-converted/raw/case-input-manifest.dump.json
          if ($LASTEXITCODE) { $failed++ }
          exit $failed

      - uses: actions/upload-artifact@v7
        if: always() && matrix.tests
        with:
          name: conformance-windows
          path: conformance/*/summary.txt

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: build/bin/${{ matrix.dll }}
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            lib: linux64/vrclient.so
            tests: true
          - arch: x86
            lib: vrclient.so
    steps:
      # The packages of scripts/ci/ubuntu.dockerfile, and git for the checkout's submodules.
      - name: Build tools
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++ g++-multilib cmake make automake autoconf libtool python3 \
            libgl-dev libvulkan-dev libgl-dev:i386 libvulkan-dev:i386

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # No new hard stop (scripts/fatal_sites.txt lists the ones still allowed)
      - name: Hard stops
        if: matrix.tests
        run: |
          python3 scripts/abort_sites.py --self-test
          python3 scripts/abort_sites.py --check

      - name: Build
        run: sh scripts/ci/build-linux.sh ${{ matrix.tests && '--tests' || '' }} ${{ matrix.arch }} build "$GITHUB_SHA ($GITHUB_REF_NAME)"

      - name: Conformance
        if: matrix.tests
        run: |
          python3 tests/conformance/run.py --runtime build/bin/linux64/vrclient.so --conformance build/tests/oc_conformance --xr-runtime none --out conformance/none
          python3 tests/conformance/run.py --runtime build/bin/linux64/vrclient.so --conformance build/tests/oc_conformance --xr-runtime none --cases applications --cases-only --expect tests/conformance/expect/applications.json --out conformance/applications

      - uses: actions/upload-artifact@v7
        if: always() && matrix.tests
        with:
          name: conformance-linux
          path: conformance/*/summary.txt

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: build/bin/${{ matrix.lib }}
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: 'windows-*'

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          dotnet --version

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "dev-$($env:GITHUB_SHA.Substring(0, 12))" }
          scripts/ci/build-installer.ps1 -Artifacts artifacts -Version $version -Out build/installer -Repository $env:GITHUB_REPOSITORY

      # Inno Setup's output isn't known to be byte-reproducible: build it again and say whether it is.
      - name: Same bytes again?
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "dev-$($env:GITHUB_SHA.Substring(0, 12))" }
          scripts/ci/build-installer.ps1 -Artifacts artifacts -Version $version -Out build/installer-again -Repository $env:GITHUB_REPOSITORY | Out-Null
          $a = (Get-FileHash build/installer/OpenComposite-Setup.exe).Hash
          $b = (Get-FileHash build/installer-again/OpenComposite-Setup.exe).Hash
          if ($a -eq $b) { "::notice::OpenComposite-Setup.exe is the same bytes when built again ($a)." }
          else { "::warning::OpenComposite-Setup.exe differs when built again ($a, $b)." }

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: build/installer/OpenComposite-Setup.exe
          if-no-files-found: error

  package:
    name: Archives
    needs: [windows, linux, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*-x*'

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: installer-build

      - name: Pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA:0:12}; fi
          python3 scripts/ci/package.py --version "$version" --artifacts artifacts --out dist --repository "$GITHUB_REPOSITORY" \
            --installer installer-build/OpenComposite-Setup.exe

      - name: Try install.sh
        run: |
          shellcheck -s sh installer/install.sh scripts/ci/test-install.sh
          sh scripts/ci/test-install.sh dist/OpenComposite-linux.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: OpenComposite
          path: dist/
          if-no-files-found: error

  release:
    name: Release files
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenComposite
          path: dist

      - name: Put the files on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- dist/OpenComposite-Setup.exe dist/OpenComposite-windows.zip dist/OpenComposite-linux.tar.gz \
            dist/OpenComposite-source.tar.gz dist/SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Made on GitHub's release page: add the files, and keep its title and notes.
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "OpenComposite ${GITHUB_REF_NAME#v}" --notes-file dist/RELEASE_NOTES.md "$@"
          fi
